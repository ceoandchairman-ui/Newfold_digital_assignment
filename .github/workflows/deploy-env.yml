# One environment's deployment, called by deploy.yml (E10-14, E11-A3/A5/A8, E12-B5).
#   plan  : Terraform plan saved as an artifact (visible before any approval)
#   apply : gated by the environment's required reviewers; applies EXACTLY the saved plan, then
#           deploys with Helm. Everything the chart needs comes from Terraform's outputs.
#
# The AKS API server is private, so kubectl/helm run INSIDE the cluster through
# `az aks command invoke` (scripts/aks_invoke.sh), not from the runner.
# Migrations and Postgres roles are a Helm pre-install/pre-upgrade hook (db-bootstrap.yaml), run as
# the db-bootstrap identity BEFORE the new pods start, so the first deploy works too.
name: deploy-env
on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      tag: { type: string, required: true }

permissions:
  id-token: write
  contents: read

env:
  TF_ENV: prod   # the only environment

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: plan-prod
    defaults:
      run:
        working-directory: infra/terraform
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_pg_admin_object_id: ${{ vars.PG_ADMIN_OBJECT_ID }}
      TF_VAR_pg_admin_name: ${{ vars.PG_ADMIN_NAME }}
      TF_VAR_pg_admin_type: ${{ vars.PG_ADMIN_TYPE || 'User' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false -backend-config="envs/${TF_ENV}.backend.hcl"
      # -lock=false: this job's identity is read-only and cannot take the state lease. Safe, because
      # the apply job takes the lock and applies this exact plan (it fails if the state moved).
      - run: terraform plan -input=false -lock=false -var-file="envs/${TF_ENV}.tfvars" -out=tfplan
      - name: Plan summary for the reviewer
        run: terraform show -no-color tfplan | tail -n 400 >> "$GITHUB_STEP_SUMMARY"
      - name: Fingerprint the reviewed plan
        run: sha256sum tfplan | tee tfplan.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: |
            infra/terraform/tfplan
            infra/terraform/tfplan.sha256

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # required reviewers gate production here, AFTER the plan is visible
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      IMAGE_REPO: ${{ vars.ACR_NAME }}.azurecr.io/support-assistant
      IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/support-assistant:${{ inputs.tag }}
      ENFORCE_SIGNING: ${{ vars.ENFORCE_SIGNING || 'false' }}
      # The smoke journey logs in as a seeded demo customer, so it runs only when demo data is seeded.
      SMOKE_PHONE: ${{ vars.SEED_DEMO_DATA == 'true' && vars.SMOKE_PHONE || '' }}
      SMOKE_DOB: ${{ vars.SEED_DEMO_DATA == 'true' && vars.SMOKE_DOB || '' }}
      SEED_DEMO_DATA: ${{ vars.SEED_DEMO_DATA || 'false' }}   # production: demo customers only if you opt in
      TF_VAR_pg_admin_object_id: ${{ vars.PG_ADMIN_OBJECT_ID }}
      TF_VAR_pg_admin_name: ${{ vars.PG_ADMIN_NAME }}
      TF_VAR_pg_admin_type: ${{ vars.PG_ADMIN_TYPE || 'User' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - uses: actions/download-artifact@v4
        with: { name: "tfplan-${{ inputs.environment }}", path: infra/terraform }

      - name: Terraform apply (the reviewed plan, byte for byte)
        working-directory: infra/terraform
        run: |
          sha256sum -c tfplan.sha256
          terraform init -input=false -backend-config="envs/${TF_ENV}.backend.hcl"
          terraform apply -input=false tfplan

      - name: Read Terraform outputs and generate the Helm values
        working-directory: infra/terraform
        run: |
          terraform output -json > ../../tf-outputs.json
          echo "RESOURCE_GROUP=$(terraform output -raw resource_group)" >> "$GITHUB_ENV"
          echo "AKS_NAME=$(terraform output -raw aks_name)" >> "$GITHUB_ENV"
          echo "GRAFANA_NAME=$(terraform output -raw grafana_name)" >> "$GITHUB_ENV"
          # Stops here if any identity or Key Vault output is missing or blank.
          python3 ../../scripts/helm_values_from_terraform.py ../../tf-outputs.json "${TF_ENV}" \
            > ../../values.generated.json

      - name: Verify the image signature before deploying it (E11-A1)
        run: |
          curl -sSfL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o cosign
          chmod +x cosign
          az acr login --name "${{ vars.ACR_NAME }}"
          ./cosign verify "$IMAGE" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      - name: Bundle the chart and values for the in-cluster helm run
        run: |
          mkdir bundle
          cp -r deploy/helm/support bundle/support
          cp values.generated.json bundle/values.generated.json
          chmod +x scripts/aks_invoke.sh

      - name: Install Kyverno (only when image-signature enforcement is on)
        if: env.ENFORCE_SIGNING == 'true'
        working-directory: bundle
        run: |
          ../scripts/aks_invoke.sh "helm repo add kyverno https://kyverno.github.io/kyverno/ && helm repo update && helm upgrade --install kyverno kyverno/kyverno --namespace kyverno --create-namespace --version 3.3.4 --wait --timeout 8m"

      - name: Helm upgrade (the pre-deploy hook migrates the database and creates its roles)
        working-directory: bundle
        run: |
          ../scripts/aks_invoke.sh "helm upgrade --install support ./support --namespace support --create-namespace --wait --timeout 15m --atomic -f values.generated.json --set image.repository=${IMAGE_REPO} --set image.tag=${{ inputs.tag }} --set signing.enforce=${ENFORCE_SIGNING} --set signing.githubRepo=${{ github.repository }} --set seed.enabled=${SEED_DEMO_DATA}" --file .

      # Pick up document changes right away instead of waiting for the schedule. Not a gate: an
      # indexing problem must not fail or roll back a deploy of the application itself.
      - name: Start a knowledge-base indexing run
        continue-on-error: true
        run: |
          scripts/aks_invoke.sh "kubectl -n support create job --from=cronjob/indexer indexer-${{ inputs.tag }}"

      - name: Smoke test (blocks promotion on failure)
        run: |
          scripts/aks_invoke.sh "kubectl -n support run smoke-${{ inputs.tag }} --rm -i --restart=Never --labels app=smoke-test --image ${IMAGE} --env SMOKE_PHONE=${SMOKE_PHONE} --env SMOKE_DOB=${SMOKE_DOB} -- python -m support_assistant.smoke"

      - name: Roll back on a failed smoke test
        if: failure()
        run: scripts/aks_invoke.sh "helm rollback support --namespace support --wait" || true

      - name: Dashboards as code
        run: |
          az extension add --name amg --only-show-errors
          az grafana dashboard import --name "$GRAFANA_NAME" --resource-group "$RESOURCE_GROUP" \
            --definition deploy/grafana/support-overview.json --overwrite true

      - name: Release annotation (deploy marker on dashboards and traces)
        run: |
          echo "Deployed ${{ inputs.tag }} to ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          az rest --method put \
            --url "https://management.azure.com$(az monitor app-insights component show \
              --app "appi-support-${TF_ENV}" -g "$RESOURCE_GROUP" --query id -o tsv)/Annotations?api-version=2015-05-01" \
            --body "{\"Id\":\"$(uuidgen)\",\"AnnotationName\":\"${{ inputs.tag }}\",\"EventTime\":\"$(date -u +%FT%TZ)\",\"Category\":\"Deployment\"}" \
            || echo "annotation skipped (non-blocking)"
