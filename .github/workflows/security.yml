# Security scanning. Separate from ci.yml so it can run on a schedule as well as on every change:
# new vulnerabilities are published daily against code that has not changed.
#
# None of these has been run yet. Action versions are pinned to major tags; pin to a commit SHA
# before relying on them in a regulated environment.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A secret committed once is a secret leaked forever, so the whole history is scanned.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Static analysis of the Python code for injection, unsafe deserialisation, weak crypto and the like.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  # Misconfiguration in Terraform, Helm and the Dockerfile (public access, root containers,
  # missing encryption), and known-vulnerable dependencies in the lockfile.
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Misconfigurations (Terraform, Helm, Dockerfile)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Vulnerable dependencies
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
