{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  annotations:
    azure.workload.identity/client-id: {{ $svc.clientId | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels: { app: {{ $name }} }
  template:
    metadata:
      labels:
        app: {{ $name }}
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ $name }}
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      # Graceful shutdown: on SIGTERM the pod first leaves the Service (preStop sleep, so no new
      # request arrives while it drains), then uvicorn finishes what is in flight, inside this window.
      terminationGracePeriodSeconds: 45
      containers:
        - name: app
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          command: {{ toJson $svc.command }}
          {{- if $svc.ports }}
          ports:
            {{- range $svc.ports }}
            - containerPort: {{ . }}
            {{- end }}
          {{- end }}
          envFrom:
            - secretRef: { name: support-env }   # synced from Key Vault by the CSI driver
          env:
            {{- range $k, $v := merge (deepCopy ($svc.env | default dict)) $.Values.commonEnv }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            {{- range $k, $v := $.Values.endpoints }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            # Part of the search release (releases.py): must match the publisher's value.
            - { name: EMBEDDING_DIM, value: {{ $.Values.embeddingDim | quote }} }
            # Semantic-convention resource attributes (service.version / deployment.environment.name).
            - { name: SERVICE_VERSION, value: {{ $.Values.image.tag | quote }} }
            - { name: DEPLOYMENT_ENVIRONMENT, value: {{ $.Values.environment | quote }} }
            # Postgres role under Entra auth = this pod's identity name (dbroles.py creates it).
            - { name: DATABASE_ENTRA_USER, value: "id-{{ $.Values.identityPrefix }}-{{ $name }}" }
            {{- with $svc.objectId }}
            # Redis username under Entra auth (terraform output workload_principal_ids).
            - { name: REDIS_ENTRA_OBJECT_ID, value: {{ . | quote }} }
            {{- end }}
          resources: {{ toJson $.Values.resources }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          lifecycle:
            preStop: { exec: { command: ["sleep", "10"] } }
          # The root filesystem is read-only, so libraries that need scratch space get a /tmp.
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            # Mounting is what makes the CSI driver create the `support-env` secret (envFrom above).
            - { name: secrets-store, mountPath: /mnt/secrets, readOnly: true }
          {{- if and $svc.ports (ne $name "mcp-servers") }}
          {{- /* Agents are ready only when the MCP tools their harness may call are really served. */}}
          readinessProbe: { httpGet: { path: {{ if or (hasPrefix "agent-" $name) (eq $name "retrieval") }}/readyz{{ else }}/healthz{{ end }}, port: 8000 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 8000 }, initialDelaySeconds: 15 }
          {{- end }}
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 100Mi } }
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: support-env }
{{- if $svc.ports }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  selector: { app: {{ $name }} }
  ports:
    {{- range $svc.ports }}
    - { name: p{{ . }}, port: {{ . }}, targetPort: {{ . }} }
    {{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $name }} }
  minReplicas: {{ $.Values.hpa.minReplicas }}
  maxReplicas: {{ $.Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ $.Values.hpa.cpuTarget }} } }
{{- end }}
{{- end }}
---
# Default deny, then allow only the declared callers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
{{- range $name, $callers := .Values.allowedCallers }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-{{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  podSelector:
    matchLabels: { app: {{ $name }} }
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $callers }}
        - podSelector: { matchLabels: { app: {{ . }} } }
        {{- end }}
{{- end }}
