# Syncs Key Vault secrets into the `support-env` Kubernetes secret that every Deployment reads.
# Terraform (secrets.tf) creates database-url, the three Redis URLs and appinsights-connection-string.
# Only embedder-api-key is added by hand (it comes from a third party).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: support-env
  namespace: {{ .Values.namespace }}
  annotations:
    # Pods (including the pre-deploy db-bootstrap hook) mount this, so it must exist before them.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  provider: azure
  parameters:
    # The Key Vault CSI addon's own managed identity reads the vault for every pod (Terraform:
    # secrets.tf). It is not a per-pod workload identity.
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.keyVault.csiClientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - objectName: database-url
          objectType: secret
        - objectName: redis-url
          objectType: secret
        - objectName: checkpoint-redis-url
          objectType: secret
        - objectName: tool-cache-redis-url
          objectType: secret
        - objectName: embedder-api-key
          objectType: secret
        - objectName: appinsights-connection-string
          objectType: secret
  secretObjects:
    # The OTel collector's exporter secret (Terraform stores it in Key Vault; no pipeline step).
    - secretName: otel-azuremonitor
      type: Opaque
      data:
        - { objectName: appinsights-connection-string, key: connection-string }
    - secretName: support-env
      type: Opaque
      data:
        - { objectName: database-url, key: DATABASE_URL }
        - { objectName: redis-url, key: REDIS_URL }
        - { objectName: checkpoint-redis-url, key: CHECKPOINT_REDIS_URL }
        - { objectName: tool-cache-redis-url, key: TOOL_CACHE_REDIS_URL }
        - { objectName: embedder-api-key, key: EMBEDDER_API_KEY }
