# Pre-deploy hook: migrations, then a Postgres role per workload identity with least-privilege
# grants (E10-6). Runs as the `db-bootstrap` identity, which is a Postgres Entra administrator, so
# no service ever needs DDL rights. If it fails, the release fails (and --atomic rolls it back);
# migrations are expand-and-contract only, so a rolled-back release stays compatible.
#
# Order on install/upgrade:  SecretProviderClass (-20)  ->  ServiceAccount (-15)  ->  Job (-10)
#                            ->  the rest of the release.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-bootstrap
  namespace: {{ .Values.namespace }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.dbBootstrap.clientId | quote }}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-bootstrap
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: db-bootstrap
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: db-bootstrap
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          # Dev only (seed.enabled): also load the demo data. The loader is idempotent.
          command: ["sh", "-c", "alembic upgrade head && python -m support_assistant.dbroles{{ if .Values.seed.enabled }} && python -m support_assistant.seed seed/example_seed.toml{{ end }}"]
          envFrom:
            - secretRef: { name: support-env }
          env:
            {{- range $k, $v := .Values.commonEnv }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            {{- range $k, $v := .Values.endpoints }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            - { name: DATABASE_ENTRA_USER, value: "id-{{ .Values.identityPrefix }}-db-bootstrap" }
            - { name: EMBEDDING_DIM, value: {{ .Values.embeddingDim | quote }} }
            - { name: IDENTITY_PREFIX, value: {{ .Values.identityPrefix | quote }} }
            - name: DB_PRINCIPALS
              value: "{{- $all := merge (deepCopy .Values.services) (deepCopy .Values.jobIdentities) -}}{{- $first := true -}}{{- range $name, $svc := $all -}}{{- if $svc.objectId -}}{{- if not $first }},{{ end -}}{{ $name }}={{ $svc.objectId }}{{- $first = false -}}{{- end -}}{{- end -}}"
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: secrets-store, mountPath: /mnt/secrets, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 100Mi } }
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: support-env }
